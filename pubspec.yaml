name: rdr
description: RDR - Real-time Drowsiness Response Ecosystem

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5

  # DI
  get_it: ^8.0.0

  # Navigation
  go_router: ^14.6.2

  # UI sizing
  flutter_screenutil: ^5.9.3

  # Face detection
  google_mlkit_face_detection: ^0.13.2

  # Camera
  camera: ^0.12.0

  # HTTP requests to ESP32
  dio: ^5.7.0

  # Local storage
  shared_preferences: ^2.2.3

  # Background foreground task
  flutter_foreground_task: ^8.3.0

  # Permissions
  permission_handler: ^11.3.1

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.13
  flutter_gen_runner: ^5.7.0

flutter_gen:
  output: lib/core/gen/
  line_length: 80

flutter:
  uses-material-design: true
  generate: true

name: rdr
description: RDR - Real-time Drowsiness Response Ecosystem

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Face detection
  google_mlkit_face_detection: ^0.13.2

  # Camera
  camera: ^0.12.0

  # HTTP requests to ESP32
  http: ^1.2.1

  # Local storage
  shared_preferences: ^2.2.3

  # Background foreground task
  flutter_foreground_task: ^8.3.0

  # Permissions
  permission_handler: ^11.3.1

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
